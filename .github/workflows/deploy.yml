# 게임 소개 사이트 CI/CD
# - PR: site/ 검사만 (차단 이슈가 있으면 실패)
# - main 브랜치 push: 검사 통과 시 GitHub Pages에 배포
#   배포 결과 = privacy-policy.md 를 Jekyll로 변환한 privacy-policy.html + site/ 전체
#   privacy-policy 주소는 Google Play 등에 등록된 공개 URL이므로 배포에서 절대 빠지면 안 된다.
# 최초 1회: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정
name: Check & Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 개인정보처리방침 원본 확인
        run: test -f privacy-policy.md || { echo "::error::privacy-policy.md 가 없습니다. 공개 URL이 깨집니다."; exit 1; }

      - id: detect
        name: site/ 존재 확인
        run: |
          if [ -f site/index.html ]; then
            echo "has_site=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_site=false" >> "$GITHUB_OUTPUT"
            echo "::notice::site/index.html 이 아직 없어 사이트 검사를 건너뜁니다."
          fi

      - name: site/ 와 개인정보처리방침 경로 충돌 확인
        if: steps.detect.outputs.has_site == 'true'
        run: |
          if [ -e site/privacy-policy.html ] || [ -e site/privacy-policy.md ]; then
            echo "::error::site/ 안에 privacy-policy 파일을 두지 마세요. 루트의 privacy-policy.md 가 원본입니다."
            exit 1
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.has_site == 'true'
        with:
          node-version: 20

      - name: 사이트 검사 (scripts/check-site.mjs)
        if: steps.detect.outputs.has_site == 'true'
        run: node scripts/check-site.mjs site

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: 개인정보처리방침만 따로 모으기
        run: mkdir -p _policy_src && cp privacy-policy.md _policy_src/

      # 기존(브랜치 배포) 방식과 같은 Jekyll 변환이라 privacy-policy 페이지 모양과 주소가 그대로 유지된다
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_policy_src
          destination: ./_site

      - name: 사이트 파일 합치기
        run: |
          sudo chown -R "$USER" _site
          if [ -d site ]; then cp -r site/. _site/; fi
          test -f _site/privacy-policy.html || { echo "::error::privacy-policy.html 이 배포 결과에 없습니다."; exit 1; }
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
