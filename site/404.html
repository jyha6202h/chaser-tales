<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지를 찾을 수 없습니다 — 체이서 테일즈 3D</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0E1430">
  <!-- GitHub Pages는 하위 경로에서도 이 파일을 보여 주므로, 경로가 어긋나지 않도록 링크는 배포 주소 기준 절대 URL로 둔다 -->
  <link rel="icon" type="image/png" sizes="32x32" href="https://jyha6202h.github.io/chaser-tales/assets/icons/favicon-32.png">
  <style>
    :root { --color-bg: #0E1430; --color-gold: #E8B44A; --color-gold-soft: #F5D58A; --color-primary: #D8322A; --color-primary-hover: #F0473C; --color-text: #F3EEE4; --color-text-muted: #A9B0C8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(ellipse at 50% 120%, rgba(255, 122, 47, 0.35), transparent 60%), var(--color-bg);
      color: var(--color-text); text-align: center;
      font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.7;
    }
    .code { font-size: clamp(3rem, 12vw, 5rem); font-weight: 900; color: var(--color-gold); margin: 0; line-height: 1; }
    h1 { font-size: clamp(1.25rem, 4vw, 1.75rem); margin: 16px 0 8px; }
    p { color: var(--color-text-muted); margin: 0; }
    a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; margin-top: 28px; border-radius: 10px; background: var(--color-primary); color: #fff; font-weight: 700; text-decoration: none; }
    a.btn:hover { background: var(--color-primary-hover); }
    a:focus-visible { outline: 3px solid var(--color-gold-soft); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>길을 잃으셨나요?</h1>
    <p>찾으시는 페이지가 없거나 주소가 바뀌었습니다.</p>
    <a class="btn" href="https://jyha6202h.github.io/chaser-tales/">첫 화면으로</a>
  </main>
</body>
</html>
